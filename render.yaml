# AgentCompass — Render Blueprint (https://render.com/docs/blueprint-spec).
#
# Render builds this repository's existing Dockerfile; nothing here is
# duplicated from it. The service is stateless, so there is no database, disk,
# or persistent volume to declare.
#
# No longer driven by CI: the `deploy` job in .github/workflows/ci.yml now
# deploys to Azure Container Apps (see containerapps/) on push to main. This
# blueprint is kept only as a manual/alternative deploy path — `autoDeploy:
# false` still applies if you re-enable it, so a push to main won't also
# trigger a Render release behind CI's back.

services:
  - type: web
    name: agent-compass
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    autoDeploy: false
    healthCheckPath: /api/health
    envVars:
      # Set in the Render dashboard, never in this file. For public
      # repositories the token needs no scopes at all — an unscoped token still
      # raises the GitHub API limit from 60 to 5,000 requests/hour and can do
      # nothing else if it leaks. Without it the API answers 429 once the
      # shared unauthenticated budget is spent.
      - key: GITHUB_TOKEN
        sync: false
      # The free instance is 0.1 CPU / 512 MB. Analysis is CPU-bound, so
      # admitting several at once would make each of them slower without
      # finishing any sooner, and risks the memory ceiling. Queue instead.
      - key: MAX_CONCURRENT_ANALYSES
        value: "1"
