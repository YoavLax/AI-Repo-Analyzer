# AgentCompass — Fly.io deployment.
#
# `app` below is the single source of truth for the deploy target: flyctl reads
# it for every command run from the repository root, and the CI deploy job in
# .github/workflows/ci.yml derives the public URL (https://<app>.fly.dev) from
# it. Do not restate the name anywhere else — see deploy/README.md.
#
# See https://fly.io/docs/reference/configuration/
#

app = 'agent-compass'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
