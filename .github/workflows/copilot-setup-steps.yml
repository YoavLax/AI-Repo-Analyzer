name: Copilot Setup Steps

# Pre-installs dependencies in GitHub Copilot's cloud agent environment so it
# can build, test, and lint without discovering the toolchain by trial and
# error. See https://docs.github.com/en/copilot/tutorials/cloud-agent/get-the-best-results

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package (editable, with dev extras)
        run: python -m pip install -e ".[dev]"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
