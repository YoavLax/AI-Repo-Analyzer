name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (editable, with dev extras)
        run: python -m pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest -v

  web:
    name: Frontend typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
      - name: Build
        working-directory: web
        run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [test, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t agentcompass:ci .
      - name: Smoke-test the container
        run: |
          docker run -d --name cc -p 8080:8080 agentcompass:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          docker logs cc
          test "$ok" = 1
          curl -fsS http://127.0.0.1:8080/ | grep -qi agentcompass
          docker rm -f cc

  helm:
    name: Helm chart lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/agentcompass
      - run: helm template deploy/helm/agentcompass > /dev/null

  dogfood:
    name: Analyze this repository with itself
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: airx analyze .
        run: airx analyze . --fail-on never
      - name: Rule catalog is in sync with docs/RULES.md
        run: |
          airx rules --format md > /tmp/RULES.md
          diff -u docs/RULES.md /tmp/RULES.md

  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    # Every other job, not just `test`: a green matrix with a broken frontend
    # build or an unbuildable image must never reach production.
    needs: [test, web, docker, helm, dogfood]
    # Pushes to main only. `pull_request` runs share this workflow, and a PR
    # from a fork would otherwise deploy unreviewed code with the production
    # token.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Never cancel a deploy midway — a half-applied release is worse than a
    # queued one. Later pushes wait instead.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    environment:
      name: production
      url: https://agent-compass.fly.dev
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --wait-timeout 300

      - name: Smoke-test the deployed release
        run: |
          # fly.toml runs min_machines_running = 0, so the first request after a
          # release wakes a machine — retry rather than assuming it is warm.
          for _ in $(seq 1 30); do
            if curl -fsS https://agent-compass.fly.dev/api/health >/dev/null 2>&1; then
              ok=1; break
            fi
            sleep 2
          done
          test "$ok" = 1
          curl -fsS https://agent-compass.fly.dev/ | grep -qi agentcompass
          version=$(curl -fsS https://agent-compass.fly.dev/api/version)
          echo "deployed: $version"
          # Guards against a release that silently served a stale image.
          echo "$version" | grep -q "$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)"
