name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (editable, with dev extras)
        run: python -m pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest -v

  web:
    name: Frontend typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
      - name: Build
        working-directory: web
        run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [test, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t agentcompass:ci .
      - name: Smoke-test the container
        run: |
          docker run -d --name cc -p 8080:8080 agentcompass:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          docker logs cc
          test "$ok" = 1
          curl -fsS http://127.0.0.1:8080/ | grep -qi agentcompass
          docker rm -f cc

  helm:
    name: Helm chart lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/agentcompass
      - run: helm template deploy/helm/agentcompass > /dev/null

  dogfood:
    name: Analyze this repository with itself
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: airx analyze .
        run: airx analyze . --fail-on never
      - name: Rule catalog is in sync with docs/RULES.md
        run: |
          airx rules --format md > /tmp/RULES.md
          diff -u docs/RULES.md /tmp/RULES.md

  action-selftest:
    name: Composite Action self-test (uses ./ against this repo)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Run this repo's own composite action against itself
        id: airx
        uses: ./
        with:
          fail-on: never
          format: json
      - name: Verify outputs were produced
        shell: bash
        run: |
          test -n "${{ steps.airx.outputs.score }}" || { echo "::error::score output was empty"; exit 1; }
          test -n "${{ steps.airx.outputs.grade }}" || { echo "::error::grade output was empty"; exit 1; }
          echo "score=${{ steps.airx.outputs.score }} grade=${{ steps.airx.outputs.grade }}"

  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    # Every other job, not just `test`: a green matrix with a broken frontend
    # build or an unbuildable image must never reach production.
    needs: [test, web, docker, helm, dogfood, action-selftest]
    # Pushes to main only. `pull_request` runs share this workflow, and a PR
    # from a fork would otherwise deploy unreviewed code with the production
    # token.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Never cancel a deploy midway — a half-applied release is worse than a
    # queued one. Later pushes wait instead.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    environment:
      name: production
      # Derived below rather than written out: a literal here drifted from
      # fly.toml once already, and the deploy still "succeeded" while the smoke
      # test probed a hostname that did not exist.
      url: ${{ steps.target.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Resolve the deploy target from fly.toml
        id: target
        run: |
          # fly.toml's `app` is the single source of truth — it is what
          # `flyctl deploy` actually deploys to, so everything downstream must
          # be derived from it rather than restated.
          app=$(sed -n "s/^app *= *['\"]\(.*\)['\"].*/\1/p" fly.toml | head -1)
          test -n "$app" || { echo "::error::no 'app' key in fly.toml"; exit 1; }
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "url=https://$app.fly.dev" >> "$GITHUB_OUTPUT"
          echo "deploying to $app (https://$app.fly.dev)"

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --wait-timeout 300

      - name: Smoke-test the deployed release
        env:
          APP_URL: ${{ steps.target.outputs.url }}
        run: |
          # fly.toml runs min_machines_running = 0, so the first request after a
          # release wakes a machine — retry rather than assuming it is warm.
          for _ in $(seq 1 30); do
            if curl -fsS "$APP_URL/api/health" >/dev/null 2>&1; then
              ok=1; break
            fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then
            echo "::error::$APP_URL/api/health never became reachable."
            echo "If you renamed the Fly app, update 'app' in fly.toml — that is"
            echo "what flyctl deploys to, and what this check is derived from."
            exit 1
          fi
          curl -fsS "$APP_URL/" | grep -qi agentcompass
          version=$(curl -fsS "$APP_URL/api/version")
          echo "deployed: $version"
          # Guards against a release that silently served a stale image.
          echo "$version" | grep -q "$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)"
