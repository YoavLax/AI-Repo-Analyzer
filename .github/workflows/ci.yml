name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (editable, with dev extras)
        run: python -m pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest -v

  web:
    name: Frontend typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
      - name: Build
        working-directory: web
        run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [test, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t agentcompass:ci .
      - name: Smoke-test the container
        run: |
          docker run -d --name cc -p 8080:8080 agentcompass:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          docker logs cc
          test "$ok" = 1
          curl -fsS http://127.0.0.1:8080/ | grep -qi agentcompass
          docker rm -f cc

  helm:
    name: Helm chart lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/agentcompass
      - run: helm template deploy/helm/agentcompass > /dev/null

  dogfood:
    name: Analyze this repository with itself
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: airx analyze .
        run: airx analyze . --fail-on never
      - name: Rule catalog is in sync with docs/RULES.md
        run: |
          airx rules --format md > /tmp/RULES.md
          diff -u docs/RULES.md /tmp/RULES.md

  action-selftest:
    name: Composite Action self-test (uses ./ against this repo)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Run this repo's own composite action against itself
        id: airx
        uses: ./
        with:
          fail-on: never
          format: json
      - name: Verify outputs were produced
        shell: bash
        run: |
          test -n "${{ steps.airx.outputs.score }}" || { echo "::error::score output was empty"; exit 1; }
          test -n "${{ steps.airx.outputs.grade }}" || { echo "::error::grade output was empty"; exit 1; }
          echo "score=${{ steps.airx.outputs.score }} grade=${{ steps.airx.outputs.grade }}"

  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    # Every other job, not just `test`: a green matrix with a broken frontend
    # build or an unbuildable image must never reach production.
    needs: [test, web, docker, helm, dogfood, action-selftest]
    # Pushes to main only. `pull_request` runs share this workflow, and a PR
    # from a fork would otherwise deploy unreviewed code with the production
    # token.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Never cancel a deploy midway — a half-applied release is worse than a
    # queued one. Later pushes wait instead.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    environment:
      name: production
      # Derived below rather than written out: a hardcoded literal drifted from
      # the real deploy target once already, and the deploy still "succeeded"
      # while the smoke test probed a hostname that did not exist.
      url: ${{ steps.target.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the Space and its URL
        id: target
        env:
          # Repository variable (not a secret) — e.g. "YoavLax/agent-compass".
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_SPACE" ]; then
            echo "::error::Repository variable HF_SPACE is unset."
            echo "Set it to '<owner>/<space-name>' under Settings -> Secrets and"
            echo "variables -> Actions -> Variables. See deploy/README.md."
            exit 1
          fi
          owner=${HF_SPACE%%/*}
          name=${HF_SPACE#*/}
          # Spaces are served from https://<owner>-<name>.hf.space, lowercased
          # with every non-alphanumeric run collapsed to a single dash.
          slug=$(printf '%s-%s' "$owner" "$name" \
            | tr '[:upper:]' '[:lower:]' \
            | tr -c 'a-z0-9' '-' \
            | sed 's/-\{2,\}/-/g; s/^-//; s/-$//')
          {
            echo "owner=$owner"
            echo "name=$name"
            echo "url=https://$slug.hf.space"
          } >> "$GITHUB_OUTPUT"
          echo "deploying $HF_SPACE -> https://$slug.hf.space"

      - name: Build the Space README
        run: |
          # Spaces take their configuration from README.md frontmatter, which
          # would render as noise at the top of the repository's own README.
          # The header is kept separately and prepended only for the artifact
          # pushed to the Space, so `app_port` and the repo README have exactly
          # one home each.
          cat deploy/huggingface/space-header.md README.md > README.space.md
          mv README.space.md README.md
          grep -q '^app_port: 8080$' README.md || {
            echo "::error::space-header.md must declare 'app_port: 8080' —"
            echo "Spaces default to 7860 and the container listens on 8080."
            exit 1
          }

      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OWNER: ${{ steps.target.outputs.owner }}
          NAME: ${{ steps.target.outputs.name }}
        run: |
          test -n "$HF_TOKEN" || { echo "::error::secret HF_TOKEN is unset."; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "release ${GITHUB_SHA}"
          # The Space repository is a build artifact, never a source of truth,
          # so its history is replaced wholesale on every release.
          git push --force \
            "https://user:${HF_TOKEN}@huggingface.co/spaces/${OWNER}/${NAME}" \
            HEAD:refs/heads/main

      - name: Smoke-test the deployed release
        env:
          APP_URL: ${{ steps.target.outputs.url }}
        run: |
          # A Space rebuilds its image from scratch on push, so this waits far
          # longer than a container swap would: up to 15 minutes, and a free
          # Space that had gone to sleep also has to cold-start.
          for _ in $(seq 1 90); do
            if curl -fsS "$APP_URL/api/health" >/dev/null 2>&1; then
              ok=1; break
            fi
            sleep 10
          done
          if [ "$ok" != 1 ]; then
            echo "::error::$APP_URL/api/health never became reachable."
            echo "Check the Space's build logs. Most common causes: app_port in"
            echo "deploy/huggingface/space-header.md does not match the port the"
            echo "container listens on, or the Docker build itself failed."
            exit 1
          fi
          curl -fsS "$APP_URL/" | grep -qi agentcompass
          version=$(curl -fsS "$APP_URL/api/version")
          echo "deployed: $version"
          # Guards against a release that silently served a stale image.
          echo "$version" | grep -q "$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)"
