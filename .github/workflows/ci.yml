name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (editable, with dev extras)
        run: python -m pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest -v

  web:
    name: Frontend typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
      - name: Build
        working-directory: web
        run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [test, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t agentcompass:ci .
      - name: Smoke-test the container
        run: |
          docker run -d --name cc -p 8080:8080 agentcompass:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          docker logs cc
          test "$ok" = 1
          curl -fsS http://127.0.0.1:8080/ | grep -qi agentcompass
          docker rm -f cc

  helm:
    name: Helm chart lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/agentcompass
      - run: helm template deploy/helm/agentcompass > /dev/null

  dogfood:
    name: Analyze this repository with itself
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: airx analyze .
        run: airx analyze . --fail-on never
      - name: Rule catalog is in sync with docs/RULES.md
        run: |
          airx rules --format md > /tmp/RULES.md
          diff -u docs/RULES.md /tmp/RULES.md

  action-selftest:
    name: Composite Action self-test (uses ./ against this repo)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Run this repo's own composite action against itself
        id: airx
        uses: ./
        with:
          fail-on: never
          format: json
      - name: Verify outputs were produced
        shell: bash
        run: |
          test -n "${{ steps.airx.outputs.score }}" || { echo "::error::score output was empty"; exit 1; }
          test -n "${{ steps.airx.outputs.grade }}" || { echo "::error::grade output was empty"; exit 1; }
          echo "score=${{ steps.airx.outputs.score }} grade=${{ steps.airx.outputs.grade }}"

  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    # Every other job, not just `test`: a green matrix with a broken frontend
    # build or an unbuildable image must never reach production.
    needs: [test, web, docker, helm, dogfood, action-selftest]
    # Pushes to main only. `pull_request` runs share this workflow, and a PR
    # from a fork would otherwise deploy unreviewed code with production
    # credentials.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Never cancel a deploy midway — a half-applied release is worse than a
    # queued one. Later pushes wait instead.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      # Required to mint the OIDC token azure/login exchanges for an Azure AD
      # token — no client secret is stored anywhere for this.
      id-token: write
    environment:
      name: production
      url: https://agentcompass.ashymeadow-b5411f47.eastus.azurecontainerapps.io
    env:
      RESOURCE_GROUP: agent-compass-rg
      ACR_NAME: agentcompassacr
      CONTAINERAPP_NAME: agentcompass
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure (OIDC, no client secret)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image
        id: image
        run: |
          # Tag with the commit sha rather than the pyproject version alone so
          # every push produces a distinct, traceable tag and always forces a
          # new revision — two commits that forget to bump the version would
          # otherwise silently redeploy the same image.
          version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          tag="${version}-${GITHUB_SHA::12}"
          image="$ACR_NAME.azurecr.io/agentcompass:$tag"
          az acr login --name "$ACR_NAME"
          docker build -t "$image" .
          docker push "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Update the container app
        run: |
          az containerapp update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CONTAINERAPP_NAME" \
            --image "${{ steps.image.outputs.image }}"

      - name: Smoke-test the deployed release
        env:
          APP_URL: https://agentcompass.ashymeadow-b5411f47.eastus.azurecontainerapps.io
        run: |
          # A new revision only takes traffic once its readiness probe passes,
          # so the first request(s) after `containerapp update` returns may
          # still hit the outgoing revision briefly during the handoff.
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 30 "$APP_URL/api/health" >/dev/null 2>&1; then
              ok=1; break
            fi
            sleep 5
          done
          if [ "$ok" != 1 ]; then
            echo "::error::$APP_URL/api/health never answered after the update."
            exit 1
          fi
          curl -fsS "$APP_URL/" | grep -qi agentcompass
          version=$(curl -fsS "$APP_URL/api/version")
          echo "deployed: $version"
          # Guards against a release that silently served a stale image.
          echo "$version" | grep -q "$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)"
