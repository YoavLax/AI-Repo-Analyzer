name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (editable, with dev extras)
        run: python -m pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest -v

  web:
    name: Frontend typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
      - name: Build
        working-directory: web
        run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [test, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t agentcompass:ci .
      - name: Smoke-test the container
        run: |
          docker run -d --name cc -p 8080:8080 agentcompass:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          docker logs cc
          test "$ok" = 1
          curl -fsS http://127.0.0.1:8080/ | grep -qi agentcompass
          docker rm -f cc

  helm:
    name: Helm chart lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/agentcompass
      - run: helm template deploy/helm/agentcompass > /dev/null

  dogfood:
    name: Analyze this repository with itself
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: airx analyze .
        run: airx analyze . --fail-on never
      - name: Rule catalog is in sync with docs/RULES.md
        run: |
          airx rules --format md > /tmp/RULES.md
          diff -u docs/RULES.md /tmp/RULES.md

  action-selftest:
    name: Composite Action self-test (uses ./ against this repo)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Run this repo's own composite action against itself
        id: airx
        uses: ./
        with:
          fail-on: never
          format: json
      - name: Verify outputs were produced
        shell: bash
        run: |
          test -n "${{ steps.airx.outputs.score }}" || { echo "::error::score output was empty"; exit 1; }
          test -n "${{ steps.airx.outputs.grade }}" || { echo "::error::grade output was empty"; exit 1; }
          echo "score=${{ steps.airx.outputs.score }} grade=${{ steps.airx.outputs.grade }}"

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    # Every other job, not just `test`: a green matrix with a broken frontend
    # build or an unbuildable image must never reach production.
    needs: [test, web, docker, helm, dogfood, action-selftest]
    # Pushes to main only. `pull_request` runs share this workflow, and a PR
    # from a fork would otherwise deploy unreviewed code with the production
    # token.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Never cancel a deploy midway — a half-applied release is worse than a
    # queued one. Later pushes wait instead.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    environment:
      name: production
      # Derived below rather than written out: a hardcoded literal drifted from
      # the real deploy target once already, and the deploy still "succeeded"
      # while the smoke test probed a hostname that did not exist.
      url: ${{ steps.target.outputs.url }}
    env:
      RENDER_API: https://api.render.com/v1
      # Not a secret: `srv-...` identifies the service but grants nothing. Keeping
      # it readable lets a failed deploy say which service it tried to release.
      SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the service and its URL
        id: target
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          if [ -z "$SERVICE_ID" ] || [ -z "$RENDER_API_KEY" ]; then
            echo "::error::RENDER_SERVICE_ID (variable) and RENDER_API_KEY (secret) must both be set."
            echo "See deploy/README.md for where to find them."
            exit 1
          fi
          # Render assigns the hostname (it appends a suffix when a name is
          # already taken), so it is read back from the API rather than guessed
          # from render.yaml. Render itself stays the single source of truth.
          svc=$(curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" \
            "$RENDER_API/services/$SERVICE_ID")
          url=$(printf '%s' "$svc" | jq -r '.serviceDetails.url // empty')
          test -n "$url" || { echo "::error::service $SERVICE_ID has no URL; is it a web service?"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "deploying $(printf '%s' "$svc" | jq -r .name) -> $url"

      - name: Trigger the deploy
        id: deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          # The API is used rather than a deploy hook because a hook returns
          # nothing that can be followed. render.yaml sets autoDeploy: false, so
          # this job is the only thing that releases — the push alone must not
          # bypass the test gate above.
          id=$(curl -fsS -X POST -H "Authorization: Bearer $RENDER_API_KEY" \
            -H 'content-type: application/json' -d '{"clearCache":"do_not_clear"}' \
            "$RENDER_API/services/$SERVICE_ID/deploys" | jq -r .id)
          test -n "$id" && [ "$id" != null ] || { echo "::error::deploy was not accepted"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "deploy $id started"

      - name: Wait for the deploy to go live
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          DEPLOY_ID: ${{ steps.deploy.outputs.id }}
        run: |
          # Render keeps serving the previous build until the new one is
          # healthy, so polling /api/health here would pass against the release
          # being replaced. Track this specific deploy instead.
          for _ in $(seq 1 120); do
            status=$(curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" \
              "$RENDER_API/services/$SERVICE_ID/deploys/$DEPLOY_ID" | jq -r .status)
            echo "  $status"
            case "$status" in
              live) exit 0 ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "::error::deploy $DEPLOY_ID ended as '$status' — see the Render dashboard's build log."
                exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::deploy $DEPLOY_ID did not go live within 20 minutes."
          exit 1

      - name: Smoke-test the deployed release
        env:
          APP_URL: ${{ steps.target.outputs.url }}
        run: |
          # The free instance sleeps after 15 minutes idle and takes 30-60s to
          # wake, so the first request after a quiet period can time out.
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 90 "$APP_URL/api/health" >/dev/null 2>&1; then
              ok=1; break
            fi
            sleep 5
          done
          if [ "$ok" != 1 ]; then
            echo "::error::$APP_URL/api/health never answered, though the deploy reported live."
            echo "Most likely the container is listening on a port Render did not assign:"
            echo "it must honour \$PORT (see the CMD in Dockerfile)."
            exit 1
          fi
          curl -fsS "$APP_URL/" | grep -qi agentcompass
          version=$(curl -fsS "$APP_URL/api/version")
          echo "deployed: $version"
          # Guards against a release that silently served a stale image.
          echo "$version" | grep -q "$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)"
