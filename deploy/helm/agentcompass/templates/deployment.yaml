apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "codecompass.fullname" . }}
  labels:
    {{- include "codecompass.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "codecompass.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "codecompass.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "codecompass.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: codecompass
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: STATIC_DIR
              value: /opt/codecompass/static
            {{- if .Values.github.tokenSecretName }}
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.github.tokenSecretName }}
                  key: {{ .Values.github.tokenSecretKey }}
            {{- end }}
            {{- if .Values.localRepos.enabled }}
            - name: ALLOW_LOCAL_PATHS
              value: "true"
            - name: LOCAL_REPOS_ROOT
              value: /repos
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            # Writable scratch space: readOnlyRootFilesystem is on and the
            # server materializes repo snapshots into temp dirs under /tmp.
            - name: tmp
              mountPath: /tmp
            {{- if .Values.localRepos.enabled }}
            - name: repos
              mountPath: /repos
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.localRepos.enabled }}
        - name: repos
          {{- if .Values.localRepos.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.localRepos.existingClaim }}
            readOnly: true
          {{- else if .Values.localRepos.hostPath }}
          hostPath:
            path: {{ .Values.localRepos.hostPath }}
            type: Directory
          {{- else }}
          {{- fail "localRepos.enabled requires localRepos.existingClaim or localRepos.hostPath" }}
          {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
