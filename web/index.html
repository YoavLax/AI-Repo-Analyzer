<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AgentCompass — score any public GitHub repo's readiness for Copilot & Claude Code. Deterministic checks, no clone, no signup."
    />
    <title>AgentCompass — AI-agent readiness scoring</title>
    <script>
      // Apply the persisted (or OS-preferred) theme before first paint to
      // avoid a light-mode flash. Mirrors the logic in src/theme.ts.
      (function () {
        try {
          var stored = localStorage.getItem("agentcompass-theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {
          /* no-op: default to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
